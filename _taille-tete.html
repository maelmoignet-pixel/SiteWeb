<script>
/* Taille du texte choisie avec A− / A+ (barre du haut), retenue sur CET appareil : appliquée avant l'affichage, sans saut. */
(function () { try { var t = parseFloat(localStorage.getItem("site-taille")); if (t >= 0.8 && t <= 2) document.documentElement.style.fontSize = (t * 100) + "%"; } catch (e) {} })();
</script>

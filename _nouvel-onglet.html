<!-- =====================================================================
     _nouvel-onglet.html : ouvre les RESSOURCES dans un nouvel onglet
     (PDF, fichiers Python, pages de cours, sites extérieurs).
     Les liens de navigation (menu, chapitres, « Retour ») restent dans
     le même onglet. Ce fichier est ajouté à toutes les pages par _quarto.yml.
     ===================================================================== -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("main a[href], #quarto-content a[href]").forEach(function (a) {
    var href = a.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("mailto:")) return;
    var ressource =
      /\.(pdf|py)(\?|#|$)/i.test(href) ||          // documents
      /(^|\/)cours\/[^#]*\.html/i.test(href) ||    // pages de cours
      /^https?:\/\//i.test(href);                  // sites extérieurs
    if (ressource) {
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    }
  });
});
</script>

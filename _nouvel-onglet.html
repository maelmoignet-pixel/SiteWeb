<!-- =====================================================================
     _nouvel-onglet.html : ouvre les PDF dans un nouvel onglet.
     Tous les autres liens (cours, chapitres, sites extérieurs…) restent
     dans le même onglet. Ce fichier est ajouté à toutes les pages par _quarto.yml.
     ===================================================================== -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll("main a[href], #quarto-content a[href]").forEach(function (a) {
    var href = a.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("mailto:")) return;
    if (/\.pdf(\?|#|$)/i.test(href)) {           // seulement les PDF
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    }
  });
});
</script>

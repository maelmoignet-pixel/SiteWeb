<!-- =====================================================================
     tableau.html : zones d'écriture au stylet sous les exemples, applications
     et démonstrations d'un cours Quarto (pour l'écran tactile de la classe).
     Les traits sont enregistrés dans le navigateur (localStorage), par cours.
     ===================================================================== -->
<style>
:root { --encre-fond: #ffffff; --encre-trait: #d6dbe5; --encre-accent: #2d4db0; --encre-texte: #1b2232; }
.encre-ouvrir { display: flex; justify-content: flex-end; margin: -0.6em 0 1.2em; }
.encre-ouvrir button, .encre-barre button, .encre-menu button {
  font: 600 15px/1 system-ui, sans-serif; border: 1px solid var(--encre-trait); background: #fff; color: var(--encre-texte);
  border-radius: 10px; min-height: 44px; min-width: 44px; padding: 0 14px; cursor: pointer; touch-action: manipulation; }
.encre-ouvrir button.ecrit { border-color: var(--encre-accent); color: var(--encre-accent); }
.encre-ouvrir button.ecrit::after { content: " ●"; }
.encre-zone { border: 2px solid var(--encre-accent); border-radius: 14px; margin: -0.4em 0 1.6em; background: var(--encre-fond); overflow: hidden; }
.encre-zone.plein { position: fixed; inset: 0; z-index: 2000; margin: 0; border-radius: 0; display: flex; flex-direction: column; }
.encre-barre { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px; background: #f3f5f9; border-bottom: 1px solid var(--encre-trait); }
.encre-barre.bas { border-bottom: 0; border-top: 1px solid var(--encre-trait); justify-content: center; }
.encre-milieu { display: flex; min-height: 0; }
.encre-zone.plein .encre-milieu { flex: 1; }
.encre-milieu .encre-defile { flex: 1; min-width: 0; }
.encre-outils { display: flex; flex-direction: column; gap: 6px; padding: 8px 6px; background: #f3f5f9; border-right: 1px solid var(--encre-trait); }
.encre-outils button { font: 600 22px/1 system-ui, sans-serif; border: 1px solid var(--encre-trait); background: #fff; color: var(--encre-texte); border-radius: 10px; width: 52px; height: 52px; cursor: pointer; touch-action: manipulation; }
.encre-outils button[aria-pressed="true"] { outline: 3px solid var(--encre-accent); outline-offset: -3px; background: #e2e8f8; }
.bouton-lien { font: 600 15px/1 system-ui, sans-serif; border: 1px solid var(--encre-trait); background: #fff; color: var(--encre-texte); border-radius: 10px;
  min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; text-decoration: none; touch-action: manipulation; }
.encre-outils { overflow-y: auto; }
.encre-lasso { position: absolute; z-index: 30; left: 50%; transform: translateX(-50%); top: 64px; display: flex; gap: 6px; background: #fff; border: 1px solid var(--encre-trait);
  border-radius: 12px; padding: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); }
.encre-lasso button { font: 600 15px system-ui, sans-serif; min-height: 44px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--encre-trait); background: #fff; cursor: pointer; }
.encre-repere { position: absolute; z-index: 30; left: 70px; top: 70px; background: #fff; border: 1px solid var(--encre-trait); border-radius: 12px; padding: 12px;
  box-shadow: 0 8px 24px rgba(27, 34, 50, .2); display: grid; gap: 8px; font: 15px system-ui, sans-serif; color: var(--encre-texte); max-width: 340px; }
.encre-repere h4 { margin: 0; font-size: 15px; }
.encre-repere .lignes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.encre-repere button { font: 600 14px system-ui, sans-serif; min-height: 40px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--encre-trait); background: #fff; cursor: pointer; }
.encre-repere button[aria-pressed="true"] { outline: 3px solid var(--encre-accent); outline-offset: -3px; }
.encre-repere .coche { font: 600 14px system-ui, sans-serif; cursor: pointer; }
.encre-repere .coche input { width: 22px; height: 22px; min-height: 0; }
.encre-repere input { width: 3.6em; min-height: 38px; text-align: center; font: 600 15px system-ui, sans-serif; border: 1px solid var(--encre-trait); border-radius: 8px; }
.encre-zone { position: relative; }
.encre-barre .sep { width: 1px; align-self: stretch; background: var(--encre-trait); margin: 0 4px; }
.encre-barre .coul { width: 44px; padding: 0; }
.encre-barre .coul i { display: block; width: 22px; height: 22px; border-radius: 50%; margin: auto; }
.encre-barre button[aria-pressed="true"] { outline: 3px solid var(--encre-accent); outline-offset: -3px; }
.encre-barre .ep i { display: block; margin: auto; background: var(--encre-texte); border-radius: 4px; width: 22px; }
.encre-barre .droite { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.encre-barre .danger { color: #b3261e; }
.encre-defile { height: 62vh; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.encre-zone.plein .encre-defile { height: auto; }
.encre-defile .vue { position: sticky; top: 0; width: 100%; touch-action: none; }
.encre-defile .vue canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
.encre-defile .vue canvas.trace { pointer-events: none; }
.encre-diag { font: 12px ui-monospace, monospace; color: #5d6679; }
.encre-defile .cale { width: 1px; }
.encre-exos { position: fixed; left: 14px; bottom: 14px; z-index: 1500; font: 700 17px/1 system-ui, sans-serif; color: #fff; background: var(--encre-accent);
  border: 0; border-radius: 999px; min-height: 52px; padding: 0 22px; box-shadow: 0 4px 14px rgba(27, 34, 50, .25); cursor: pointer; touch-action: manipulation; }
.encre-manuel { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.encre-manuel input { width: 4.2em; min-height: 44px; font: 600 16px system-ui, sans-serif; text-align: center; border: 1px solid var(--encre-trait); border-radius: 10px; }
.encre-manuel .m-lien { font: 600 15px system-ui, sans-serif; color: #fff; background: var(--encre-accent); border-radius: 10px; padding: 0 14px; min-height: 44px; display: inline-flex; align-items: center; text-decoration: none; }
.encre-recadrage { position: fixed; inset: 0; z-index: 2600; background: rgba(27, 34, 50, .82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
.encre-recadrage .cadre { position: relative; max-width: 100%; max-height: calc(100% - 90px); touch-action: none; user-select: none; -webkit-user-select: none; }
.encre-recadrage img { display: block; max-width: 100%; max-height: calc(100vh - 140px); }
.encre-recadrage .sel { position: absolute; border: 3px solid #ffcc00; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45); pointer-events: none; }
.encre-recadrage .conseil { background: #ffcc00; color: #1b2232; padding: 6px 12px; border-radius: 8px; font-weight: 600; }
.encre-recadrage p { color: #fff; font: 15px system-ui, sans-serif; margin: 0; }
.encre-recadrage .boutons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.encre-recadrage button { font: 600 15px system-ui, sans-serif; min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; cursor: pointer; }
.encre-recadrage .ok { background: #ffcc00; }
.encre-manuel .m-msg { font: 14px system-ui, sans-serif; color: #b3261e; }
.encre-zone.exos .encre-barre select { font: 600 15px system-ui, sans-serif; min-height: 44px; border-radius: 10px; border: 1px solid var(--encre-trait); padding: 0 8px; background: #fff; }
.encre-menu { position: fixed; right: 14px; bottom: 14px; z-index: 1500; display: flex; gap: 6px; }
.encre-menu .info { font: 13px system-ui, sans-serif; color: #5d6679; align-self: center; background: #fff; padding: 4px 8px; border-radius: 8px; }
.encre-zone, .encre-barre, .encre-outils, .encre-ouvrir, .encre-exos, .encre-menu { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
@media print { .encre-ouvrir, .encre-zone, .encre-menu, .encre-exos { display: none !important; } }
</style>
<script>
(() => {
  const PAGE = "encre:" + (location.protocol === "file:" ? document.title : location.pathname);
  const LARGEUR = 1600, PAS = 700;                       // largeur logique fixe ; la zone s'allonge par pas de 700
  const CALCULATRICE = "https://www.numworks.com/fr/emulateur/graphique/";
  // outils de tracé : main levée, et formes « à la règle » (enregistrées comme des traits, comme le reste)
  const OUTILS = [["stylo", "✎", "Main levée"], ["surligneur", "🖍", "Surligneur"], ["pointeur", "✦", "Pointeur (s'efface tout seul)"], ["seg", "╱", "Segment (règle)"], ["fleche", "→", "Flèche, vecteur"], ["cercle", "◯", "Cercle"], ["rect", "▭", "Rectangle"],
                  ["repere", "⊞", "Repère orthonormé"], ["point", "•", "Point (s'aimante au quadrillage)"], ["lasso", "⬚", "Lasso : entourer pour déplacer, agrandir, recolorer, dupliquer"], ["deplacer", "✥", "Déplacer, agrandir"]];
  const REPERES = [
    { nom: "Classique (−5 à 5)", r: { xmin: -5, xmax: 5, ymin: -5, ymax: 5, px: "1", py: "1" } },
    { nom: "Grand (−10 à 10)", r: { xmin: -10, xmax: 10, ymin: -10, ymax: 10, px: "2", py: "2" } },
    { nom: "Premier quadrant (0 à 10)", r: { xmin: 0, xmax: 10, ymin: 0, ymax: 10, px: "1", py: "1" } },
    { nom: "Trigonométrie (−2π à 2π)", r: { xmin: -2, xmax: 2, ymin: -2, ymax: 2, px: "pi/2", py: "1" } }];
  const COULEURS = ["#1b2232", "#2d4db0", "#c0262d", "#11845b"];
  const EPAISSEURS = [3, 6, 12];
  let reglages = { coul: COULEURS[0], ep: EPAISSEURS[1], doigt: "defile" };
  try { Object.assign(reglages, JSON.parse(localStorage.getItem("encre-reglages") || "{}")); } catch (e) {}
  let STYLET_VU = false; try { STYLET_VU = localStorage.getItem("encre-stylet-vu") === "1"; } catch (e) {}
  const garderReglages = () => { try { localStorage.setItem("encre-reglages", JSON.stringify(reglages)); } catch (e) {} };

  /* Figures : chargement (une fois) et place dans la zone, centrée en haut, 80 % de la largeur */
  const IMAGES = {};
  let baseIdb = null;
  function idb() {
    baseIdb = baseIdb || new Promise((ok, ko) => { const r = indexedDB.open("encre-captures", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("captures"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
    return baseIdb;
  }
  const idbPut = (id, v) => idb().then(db => new Promise((ok, ko) => { const t = db.transaction("captures", "readwrite"); t.objectStore("captures").put(v, id); t.oncomplete = ok; t.onerror = () => ko(t.error); }));
  const idbGet = id => idb().then(db => new Promise((ok, ko) => { const r = db.transaction("captures").objectStore("captures").get(id); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }));
  function chargerImage(src) {
    if (src.startsWith("idb:")) {                                       // capture enregistrée sur l'appareil
      if (!IMAGES[src]) IMAGES[src] = idbGet(src.slice(4)).then(d => { if (!d) throw new Error("capture absente"); return chargerImage(d); });
      return IMAGES[src];
    }
    if (!IMAGES[src]) IMAGES[src] = new Promise((ok, ko) => { const im = new Image(); if (/^https?:/.test(src)) im.crossOrigin = "anonymous";
      im.onload = () => ok(im); im.onerror = ko; im.src = src; });
    return IMAGES[src];
  }
  function boiteFond(im) {
    const nw = im.naturalWidth || 1280, nh = im.naturalHeight || 800;
    let w = LARGEUR * 0.8, h = w * nh / nw; if (h > 1400) { h = 1400; w = h * nw / nh; }
    return [(LARGEUR - w) / 2, 30, w, h];
  }
  /* Manuel du niveau : exercices découpés, publiés avec le site (seconde : Sésamath, licence CC BY-SA) */
  const MANUELS = { seconde: { dossier: "seconde/exercices-sesamath/", nom: "manuel Sésamath Seconde (CC BY-SA)", lien: "https://manuel.sesamath.net/numerique/?ouvrage=ms2_2019" },
                    "premiere-spe": { lien: "https://manuel.sesamath.net/numerique/?ouvrage=ms1spe_2019", nom: "manuel Sésamath Première spécialité (CC BY-SA)" },
                    "premiere-tc": { lien: "https://manuel.sesamath.net/numerique/?ouvrage=ms1tces_2023", nom: "manuel Sésamath Première tronc commun (CC BY-SA)" },
                    "terminale-spe": { lien: "https://www.lelivrescolaire.fr/page/48150563?num=0&singlePageIndex=1", nom: "Le Livre Scolaire" } };
  const niveau = window.ENCRE_NIVEAU || (location.pathname.match(/\/(seconde|premiere-spe|premiere-tc|terminale-spe)\//) || [])[1];
  const MANUEL = MANUELS[niveau] ? Object.assign({}, MANUELS[niveau]) : null;
  if (MANUEL && MANUEL.dossier) {
    const lib = document.querySelector('script[src*="site_libs/"]');
    MANUEL.base = lib ? lib.getAttribute("src").split("site_libs/")[0] + MANUEL.dossier
                      : "https://maelmoignet-pixel.github.io/SiteWeb/" + MANUEL.dossier;   // fichier sur clé USB : depuis le site
  }
  let indexManuel = null;
  function trouverExercice(n, p) {
    indexManuel = indexManuel || fetch(MANUEL.base + "index.json").then(r => r.json());
    return indexManuel.then(idx => { const f = idx[n + "@" + p]; if (!f) throw new Error("absent"); return MANUEL.base + f; });
  }
  Zone.toutes = [];
  /* Les blocs qui reçoivent une zone d'écriture */
  const AVEC_ZONE = ["exemple", "application", "exercice"];
  const estBloc = el => el && AVEC_ZONE.some(c => el.classList.contains(c));
  // Une solution qui suit une application, un exemple ou une autre solution partage la zone déjà placée :
  // une seule zone « Écrire » par exercice, même s'il a plusieurs solutions à la suite.
  const blocs = [...document.querySelectorAll("main .exemple, main .application, main .exercice, main .callout-caution")]
    .filter(b => { if (!b.classList.contains("callout-caution")) return true;
                   const p = b.previousElementSibling; return !(estBloc(p) || (p && p.classList.contains("callout"))); });
  const vus = {}, numeros = {};
  const NOMS = { exemple: "Exemple", application: "Application", exercice: "Exercice", solution: "Démonstration", figure: "Figure" };
  function texteLisible(el) {                 // texte du bloc avec les formules en LaTeX (sans le doublon de KaTeX)
    const c = el.cloneNode(true);
    c.querySelectorAll(".katex").forEach(k => { const a = k.querySelector("annotation"); k.replaceWith(" " + (a ? a.textContent : k.textContent) + " "); });
    c.querySelectorAll(".callout-title, .callout-header").forEach(x => x.remove());
    return (c.textContent || "").replace(/\s+/g, " ").trim();
  }
  function titreBloc(bloc, type) {
    numeros[type] = (numeros[type] || 0) + 1;
    const sec = bloc.closest("section"), h = sec && sec.querySelector("h1, h2, h3, h4");
    const section = h ? h.textContent.replace(/^[\d.\s]+/, "").trim() : "";
    let extrait = texteLisible(bloc); if (extrait.length > 140) extrait = extrait.slice(0, 137) + "…";
    return [NOMS[type] + " " + numeros[type] + (section ? " — " + section : ""), extrait];
  }
  blocs.forEach(bloc => {
    const type = bloc.classList.contains("callout-caution") ? "solution" : [...bloc.classList].find(c => ["exemple", "application", "exercice"].includes(c));
    const debut = (bloc.textContent || "").replace(/\s+/g, " ").trim().slice(0, 60);
    let cle = type + ":" + debut;                         // stable tant que le texte du bloc ne change pas
    vus[cle] = (vus[cle] || 0) + 1; if (vus[cle] > 1) cle += "#" + vus[cle];
    new Zone(bloc, PAGE + "|" + cle, type, { titre: titreBloc(bloc, type) });
  });
  /* Figures du cours : zone d'écriture avec la figure en fond (on écrit dessus et autour) */
  let nFig = 0;
  [...document.querySelectorAll("main div.quarto-figure")].forEach(fig => {
    const img = fig.querySelector("img, svg"); if (!img || fig.closest(".encre-zone")) return;
    nFig++;
    // figure intégrée en SVG (version clé USB) : on la transforme en image
    const src = img.tagName.toLowerCase() === "svg" ? "data:image/svg+xml;charset=utf-8," + encodeURIComponent(new XMLSerializer().serializeToString(img)) : (img.getAttribute("src") || "");
    let cle = "figure:" + (src.startsWith("data:") ? "n" + nFig : src.split("/").pop());
    vus[cle] = (vus[cle] || 0) + 1; if (vus[cle] > 1) cle += "#" + vus[cle];
    const t = titreBloc(fig, "figure"); t[1] = (img.getAttribute && img.getAttribute("alt")) || "";
    new Zone(fig, PAGE + "|" + cle, "figure", { titre: t, fond: src, cleExos: PAGE + "|" + cle + "#img" });
  });

  /* opts.flottant : zone « Exercices » ouverte par le bouton fixe (pas de bouton dans le cours, toujours plein écran) */
  function Zone(bloc, cle, type, opts = {}) {
    const z = this;
    let traits = []; try { traits = JSON.parse(localStorage.getItem(cle) || "[]"); } catch (e) {}
    let annules = [], hauteur = Math.max(PAS * 1.3, ...traits.map(t => maxY(t) + PAS));
    let fondImg = null;
    let exos = []; try { exos = JSON.parse(localStorage.getItem(opts.cleExos || "") || "[]"); } catch (e) {}   // [{n, p, src, x, y, w, h}]
    const imgExos = new Map();
    const nouvelId = l => l + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    exos.forEach(e => { if (!e.id) e.id = nouvelId("i"); });           // chaque image a un identifiant (pour y rattacher l'écriture)
    let ajuster = false, selImg = null, selObj = null;
    let selLasso = null, lassoPts = null, ephemeres = [], etats = [];  // lasso (sélection, contour en cours), pointeur, retours du lasso
    function memoriser() { etats.push({ avant: JSON.parse(JSON.stringify(traits)) }); if (etats.length > 30) etats.shift(); }
    function finMemo() { const e = etats[etats.length - 1]; if (e) { e.n = traits.length; e.dernier = traits[traits.length - 1]; } annules = []; }
    function fermerMenuLasso() { const m = zone && zone.querySelector(".encre-lasso"); if (m) m.remove(); }
    function ouvrirMenuLasso() {
      fermerMenuLasso(); const m = document.createElement("div"); m.className = "encre-lasso";
      m.innerHTML = '<button data-a="l-coul">Couleur choisie</button><button data-a="l-dup">Dupliquer</button><button data-a="l-sup">Supprimer</button><button data-a="l-fin">Terminer</button>';
      zone.appendChild(m);
    }
    function boiteLasso() {
      let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
      selLasso.forEach(t => { const m = t.f === "point" ? 10 : t.w / 2; for (let i = 0; i < t.p.length; i += 2) { a = Math.min(a, t.p[i] - m); c = Math.max(c, t.p[i] + m); b = Math.min(b, t.p[i + 1] - m); d = Math.max(d, t.p[i + 1] + m); } });
      return [a - 8, b - 8, c - a + 16, d - b + 16];
    }            // mode « Ajuster les images » : sélectionner, déplacer, redimensionner
    const chargerExos = () => exos.forEach(e => chargerImage(e.src).then(im => { imgExos.set(e.src, im); if (zone) dessiner(); }, () => {}));
    if (opts.cleExos) { chargerExos(); hauteur = Math.max(hauteur, ...exos.map(e => e.y + e.h + PAS)); }
    const sauverExos = () => { try { if (exos.length) localStorage.setItem(opts.cleExos, JSON.stringify(exos)); else localStorage.removeItem(opts.cleExos);
                                     localStorage.setItem(PAGE + "#modifie", String(Date.now())); } catch (e) {} };
    const basContenu = () => Math.max(opts.entete ? 190 : 0, ...traits.map(t => maxY(t) + t.w), ...exos.map(e => e.y + e.h + 50));
    const estImage = o => exos.includes(o);
    function boite(o) {                                  // [x, y, largeur, hauteur] d'une image ou d'un repère
      if (estImage(o)) return [o.x, o.y, o.w, o.h];
      if (o.f === "repere") return [o.r.x0, o.r.y0, (o.r.xmax - o.r.xmin) * o.r.u, (o.r.ymax - o.r.ymin) * o.r.u];
      return null;
    }
    const enfants = o => traits.filter(t => t !== o && o.id && (t.lien === o.id || t.rep === o.id));
    function photo(o) {                                  // état de départ d'un objet et de ce qui lui est rattaché
      const p = o.p ? o.p.slice() : null, r = o.r ? Object.assign({}, o.r) : null, img = estImage(o) ? { x: o.x, y: o.y, w: o.w, h: o.h } : null;
      return { o, p, r, img, enf: enfants(o).map(t => ({ t, p: t.p.slice(), w: t.w })) };
    }
    function transformer(ph, k, dx, dy) {                // agrandir de k depuis le coin haut-gauche, puis décaler de (dx, dy)
      const o = ph.o, b0 = ph.img ? [ph.img.x, ph.img.y] : ph.r ? [ph.r.x0, ph.r.y0] : [ph.p[0], ph.p[1]];
      const f = (x, y) => [b0[0] + (x - b0[0]) * k + dx, b0[1] + (y - b0[1]) * k + dy];
      if (ph.img) { [o.x, o.y] = f(ph.img.x, ph.img.y); o.w = ph.img.w * k; o.h = ph.img.h * k; }
      if (ph.r) { [o.r.x0, o.r.y0] = f(ph.r.x0, ph.r.y0); o.r.u = ph.r.u * k; }
      if (ph.p) for (let i = 0; i < ph.p.length; i += 2) [o.p[i], o.p[i + 1]] = f(ph.p[i], ph.p[i + 1]);
      ph.enf.forEach(e => { for (let i = 0; i < e.p.length; i += 2) [e.t.p[i], e.t.p[i + 1]] = f(e.p[i], e.p[i + 1]);
        if (e.t.f !== "point") e.t.w = Math.max(1, e.w * k); BORNES.delete(e.t); });
      if (o.p) BORNES.delete(o);
    }
    /* Une écriture faite sur une image ou un repère lui appartient (elle suivra ses déplacements et sa taille) */
    function rattacher(t) {
      if (t.rep || t.f === "repere") return;
      let meilleur = null, aire = Infinity;

    const c2 = cv.getContext("2d"); c2.scale(K, K);
    c2.fillStyle = "#fff"; c2.fillRect(0, 0, W, H);
    if (!enteteExos) {
      c2.fillStyle = "#eef1f8"; c2.fillRect(0, 0, W, bandeau - 10);
      c2.fillStyle = "#2d4db0"; c2.font = "700 38px system-ui, sans-serif"; c2.fillText(titre, 30, 52);
      c2.fillStyle = "#3a4256"; c2.font = "400 30px system-ui, sans-serif"; lignes.forEach((l, i) => c2.fillText(l, 30, 98 + i * 40));
    } else {
      c2.fillStyle = "#2d4db0"; c2.font = "700 52px system-ui, sans-serif"; c2.fillText(enteteExos[0], 30, 72);
      c2.fillStyle = "#1b2232"; c2.font = "600 40px system-ui, sans-serif"; c2.fillText(enteteExos[1], 30, 134);
      c2.strokeStyle = "#2d4db0"; c2.lineWidth = 3; c2.beginPath(); c2.moveTo(30, 160); c2.lineTo(W - 30, 160); c2.stroke();
    }
    c2.translate(0, bandeau);
    if (bf) c2.drawImage(fond, bf[0], bf[1], bf[2], bf[3]);
    insertions.forEach(e => { if (e.im) c2.drawImage(e.im, e.x, e.y, e.w, e.h);
      c2.fillStyle = "#5d6679"; c2.font = "italic 24px system-ui, sans-serif"; c2.fillText(legende(e), e.x, e.y + e.h + 30); });
    [...traits.filter(t => t.f === "repere"), ...traits.filter(t => t.h), ...traits.filter(t => t.f !== "repere" && !t.h)].forEach(t => traceTrait(c2, t, traits));
    return cv;
  }
  function titrePartie(texte) {
    const cv = document.createElement("canvas"); cv.width = 1200; cv.height = 90;
    const c2 = cv.getContext("2d"); c2.fillStyle = "#fff"; c2.fillRect(0, 0, 1200, 90);
    c2.fillStyle = "#1b2232"; c2.font = "700 44px system-ui, sans-serif"; c2.fillText(texte, 10, 58);
    c2.fillStyle = "#2d4db0"; c2.fillRect(10, 76, 1180, 4);
    return cv;
  }
  async function creerPdf(nom) {
    const info = menu.querySelector(".info"); info.textContent = "Création du PDF…";
    try {
      const { jsPDF } = await chargerJsPdf();
      const doc = new jsPDF({ unit: "mm", format: "a4" });
      const M = 12, L = 210 - 2 * M, HP = 297 - 2 * M;
      let y = M, vide = true;
      const placer = cv => {                    // place une image, sur plusieurs pages si elle est trop haute
        const ech = L / cv.width; let h = cv.height * ech;
        if (!vide && h > 297 - M - y && h <= HP) { doc.addPage(); y = M; }
        let depuis = 0;
        while (depuis < cv.height) {
          const reste = (297 - M - y) / ech;
          if (reste < 40) { doc.addPage(); y = M; continue; }
          const morceau = Math.min(cv.height - depuis, reste);
          const part = document.createElement("canvas"); part.width = cv.width; part.height = Math.ceil(morceau);
          part.getContext("2d").drawImage(cv, 0, depuis, cv.width, morceau, 0, 0, cv.width, morceau);
          doc.addImage(part.toDataURL("image/jpeg", 0.85), "JPEG", M, y, L, morceau * ech);
          y += morceau * ech + 5; depuis += morceau; vide = false;
        }
      };
      const lire = k => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch (e) { return []; } };
      const notes = Zone.toutes.filter(z => z.titre && lire(z.cle).length);
      const feuilles = [];
      try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i);
        if (k && k.startsWith(PREFIXE_EXOS) && lire(k).length) feuilles.push(k);
        if (k && k.startsWith(PAGE + "#exos-img:") && lire(k).length && !feuilles.includes(PREFIXE_EXOS + k.slice((PAGE + "#exos-img:").length))) feuilles.push(PREFIXE_EXOS + k.slice((PAGE + "#exos-img:").length)); } } catch (e) {}
      feuilles.splice(0, feuilles.length, ...new Set(feuilles));
      feuilles.sort();
      if (!notes.length && !feuilles.length) { info.textContent = "Aucune note à mettre en PDF"; return; }
      if (notes.length) { placer(titrePartie("Notes de cours — " + chapitre)); for (const z of notes) {
          const ins = (z.images ? z.images() : []).map(e => Object.assign({}, e));
          for (const e of ins) e.im = await chargerImage(e.src).catch(() => null);
          placer(image(lire(z.cle), z.titre[0], z.titre[1], null, null, ins)); } }
      if (feuilles.length) {
        if (!vide) { doc.addPage(); y = M; vide = true; }
        placer(titrePartie("Exercices — " + chapitre));
        for (const [i, k] of feuilles.entries()) {
          if (i > 0) { doc.addPage(); y = M; }
          const iso = k.slice(PREFIXE_EXOS.length), ins = lire(PAGE + "#exos-img:" + iso);
          for (const e of ins) e.im = await chargerImage(e.src).catch(() => null);
          placer(image(lire(k), "", "", [dateLongue(iso), chapitre], null, ins));
        }
      }
      doc.save(nom);
      majInfo();
    } catch (e) { info.textContent = "PDF impossible (" + (e && e.message ? e.message : "bibliothèque introuvable") + ")"; }
  }
  const fichier = menu.querySelector("input");
  menu.addEventListener("click", e => {
    const m = e.target.dataset.m;
    if (m === "exp") {
      const donnees = {}; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && (k.startsWith(PAGE + "|") || k.startsWith(PAGE + "#exos-img:"))) donnees[k] = JSON.parse(localStorage.getItem(k)); } } catch (x) {}
      let quand = new Date(); try { const t = +localStorage.getItem(PAGE + "#modifie"); if (t) quand = new Date(t); } catch (x) {}
      const base = "notes-" + chapitre.replace(/[^\wÀ-ÿ-]+/g, "-") + "-" + isoJour(quand);
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(donnees)], { type: "application/json" }));
      a.download = base + ".json"; a.click();
      creerPdf(base + ".pdf");
    }
    if (m === "imp") fichier.click();
  });
  fichier.addEventListener("change", async () => {
    const f = fichier.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); Object.entries(d).forEach(([k, v]) => localStorage.setItem(k, JSON.stringify(v))); location.reload(); }
    catch (e) { menu.querySelector(".info").textContent = "Fichier de notes illisible"; }
  });
})();
</script>
